<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Study Progress Tracker</title>
  <style>
    :root {
      --bg: #121417;
      --card-bg: #1c1f24;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --warning: #d97706;
      --warning-hover: #b45309;
      --success: #16a34a;
      --success-hover: #15803d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e3440;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Orologio Digitale */
    .digital-clock-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .clock-time {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #60a5fa;
      font-family: monospace;
    }
    .clock-date {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 4px;
      text-transform: capitalize;
    }

    /* Warning Banner */
    #alarm-banner {
      display: none;
      padding: 16px;
      background-color: var(--danger);
      color: white;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 8px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.99); }
      100% { opacity: 1; transform: scale(1.01); }
    }

    /* Card Layouts */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Counter Control */
    .counter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 1.4rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); }

    .btn-pause {
      background: var(--warning);
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      color: white;
      transition: background 0.15s ease;
    }
    .btn-pause:hover { background: var(--warning-hover); }
    
    .btn-pause.is-paused {
      background: var(--success);
    }
    .btn-pause.is-paused:hover {
      background: var(--success-hover);
    }

    input[type="number"] {
      background: #0f1115;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      width: 160px;
      padding: 8px;
      border-radius: 6px;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .timer-info {
      text-align: center;
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .settings-row {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .settings-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-group input[type="number"] {
      font-size: 1rem;
      width: 60px;
      padding: 4px 6px;
    }

    .settings-group input[type="file"] {
      font-size: 0.8rem;
      color: var(--muted);
    }

    #current-audio-name {
      color: #60a5fa;
      font-style: italic;
    }

    .btn-reset-audio {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-reset-audio:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }
    .text-right { text-align: right; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #2e3440;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Orologio Digitale -->
  <div class="digital-clock-card">
    <div class="clock-time" id="digital-clock">00:00:00</div>
    <div class="clock-date" id="digital-date">--</div>
  </div>

  <!-- Allarme Inattività -->
  <div id="alarm-banner">🎼 Tempo scaduto: riprendi a studiare!</div>

  <!-- Tracker Linea Corrente -->
  <div class="card">
    <h2>Linea Corrente</h2>
    <div class="counter-wrapper">
      <button class="btn" onclick="adjustLine(-10)">-10</button>
      <button class="btn" onclick="adjustLine(-1)">▼</button>
      <input type="number" id="line-input" min="0" value="0" onchange="onManualInputChange()">
      <button class="btn" onclick="adjustLine(1)">▲</button>
      <button class="btn" onclick="adjustLine(10)">+10</button>
    </div>
    
    <div class="timer-info">
      <div>Prossimo controllo: <strong id="time-remaining" style="color: var(--text);">--:--</strong></div>
      <button id="pause-btn" class="btn-pause" onclick="togglePause()">⏸️ Pausa</button>
    </div>

    <!-- Pannello Impostazioni -->
    <div class="settings-row">
      <div class="settings-group">
        <label for="alarm-minutes">Timeout inattività (min):</label>
        <input type="number" id="alarm-minutes" min="1" max="120" value="5" onchange="onTimeoutChange()">
      </div>
      <div class="settings-group">
        <label for="custom-audio-input">File audio allarme:</label>
        <input type="file" id="custom-audio-input" accept="audio/*" onchange="handleAudioUpload(event)">
        <span id="current-audio-name">Beethoven - Eroica (default)</span>
        <button id="btn-reset-audio" class="btn-reset-audio" style="display:none;" onclick="resetToDefaultAudio()">Ripristina default</button>
      </div>
    </div>
  </div>

  <!-- Progresso Odierno per Ora -->
  <div class="card">
    <h2>Progresso di Oggi per Fascia Oraria</h2>
    <table id="hourly-table">
      <thead>
        <tr>
          <th>Ora</th>
          <th class="text-right">Linea Finale</th>
          <th class="text-right">Linee Avanzate</th>
        </tr>
      </thead>
      <tbody>
        <!-- Popolato via JS -->
      </tbody>
    </table>
  </div>

  <!-- Storico Giornaliero -->
  <div class="card">
    <h2>Storico Giornaliero</h2>
    <table id="history-table">
      <thead>
        <tr>
          <th>Data</th>
          <th class="text-right">Linea Raggiunta</th>
          <th class="text-right">Linee Totali Lette</th>
        </tr>
      </thead>
      <tbody>
        <!-- Popolato via JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Elemento Audio HTML5 -->
<audio id="alarm-audio" loop preload="auto"></audio>

<script>
  const DEFAULT_AUDIO_URL = "https://upload.wikimedia.org/wikipedia/commons/2/23/Ludwig_van_Beethoven_-_Symphony_No._3_in_E-flat_Major%2C_Op._55_-_I._Allegro_con_brio.ogg";
  let lastActivityTime = Date.now();
  let currentLine = 0;
  let isPaused = false;
  let currentAudioUrlObject = null;
  const audioElement = document.getElementById('alarm-audio');

  // --- IndexedDB per memorizzazione persistente del file audio ---
  const DB_NAME = 'StudyTrackerDB';
  const STORE_NAME = 'AudioStore';

  function openAudioDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = (e) => resolve(e.target.result);
      request.onerror = (e) => reject(e.target.error);
    });
  }

  async function saveAudioBlob(blob, fileName) {
    const db = await openAudioDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put({ id: 'saved_alarm_audio', blob, fileName });
  }

  async function getStoredAudio() {
    const db = await openAudioDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get('saved_alarm_audio');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  async function deleteStoredAudio() {
    const db = await openAudioDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete('saved_alarm_audio');
  }

  async function initAudioSource() {
    const stored = await getStoredAudio();
    if (stored && stored.blob) {
      if (currentAudioUrlObject) URL.revokeObjectURL(currentAudioUrlObject);
      currentAudioUrlObject = URL.createObjectURL(stored.blob);
      audioElement.src = currentAudioUrlObject;
      document.getElementById('current-audio-name').textContent = stored.fileName || 'File personalizzato';
      document.getElementById('btn-reset-audio').style.display = 'inline-block';
    } else {
      audioElement.src = DEFAULT_AUDIO_URL;
      document.getElementById('current-audio-name').textContent = 'Beethoven - Eroica (default)';
      document.getElementById('btn-reset-audio').style.display = 'none';
    }
    audioElement.load();
  }

  async function handleAudioUpload(event) {
    const file = event.target.files[0];
    if (file) {
      await saveAudioBlob(file, file.name);
      if (currentAudioUrlObject) URL.revokeObjectURL(currentAudioUrlObject);
      currentAudioUrlObject = URL.createObjectURL(file);
      audioElement.src = currentAudioUrlObject;
      audioElement.currentTime = 0;
      audioElement.load();

      document.getElementById('current-audio-name').textContent = file.name;
      document.getElementById('btn-reset-audio').style.display = 'inline-block';
    }
  }

  async function resetToDefaultAudio() {
    await deleteStoredAudio();
    if (currentAudioUrlObject) URL.revokeObjectURL(currentAudioUrlObject);
    currentAudioUrlObject = null;
    document.getElementById('custom-audio-input').value = '';
    initAudioSource();
  }

  // --- Caricamento Dati del Tracker ---
  let appData = JSON.parse(localStorage.getItem('study_tracker_data')) || {
    currentLine: 0,
    inactivityMinutes: 5,
    hourlyLog: {},
    dailyHistory: {}
  };

  let inactivityLimitMs = (appData.inactivityMinutes || 5) * 60 * 1000;
  document.getElementById('alarm-minutes').value = appData.inactivityMinutes || 5;

  currentLine = appData.currentLine || 0;
  document.getElementById('line-input').value = currentLine;

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('digital-clock').textContent = `${hours}:${minutes}:${seconds}`;

    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('digital-date').textContent = now.toLocaleDateString('it-IT', dateOptions);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function onTimeoutChange() {
    const inputVal = parseInt(document.getElementById('alarm-minutes').value, 10);
    const validMinutes = isNaN(inputVal) || inputVal < 1 ? 5 : inputVal;
    
    document.getElementById('alarm-minutes').value = validMinutes;
    appData.inactivityMinutes = validMinutes;
    inactivityLimitMs = validMinutes * 60 * 1000;
    
    localStorage.setItem('study_tracker_data', JSON.stringify(appData));
    resetInactivityTimer();
  }

  function startAlarm() {
    if (isPaused) return;
    document.getElementById('alarm-banner').style.display = 'block';
    audioElement.play().catch(() => {});
  }

  function stopAlarm() {
    document.getElementById('alarm-banner').style.display = 'none';
    audioElement.pause();
  }

  function resetInactivityTimer() {
    lastActivityTime = Date.now();
    stopAlarm();
  }

  function togglePause() {
    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pause-btn');
    const timeRemainingEl = document.getElementById('time-remaining');

    if (isPaused) {
      stopAlarm();
      pauseBtn.textContent = '▶️ Riprendi';
      pauseBtn.classList.add('is-paused');
      timeRemainingEl.textContent = 'IN PAUSA';
      timeRemainingEl.style.color = '#f59e0b';
    } else {
      pauseBtn.textContent = '⏸️ Pausa';
      pauseBtn.classList.remove('is-paused');
      timeRemainingEl.style.color = 'var(--text)';
      resetInactivityTimer();
    }
  }

  function updateLog(newLine, deltaToAdd = 0) {
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const hourStr = String(now.getHours()).padStart(2, '0') + ":00";

    if (!appData.hourlyLog[dateStr]) appData.hourlyLog[dateStr] = {};
    if (!appData.hourlyLog[dateStr][hourStr]) {
      appData.hourlyLog[dateStr][hourStr] = { maxLine: newLine, linesDelta: 0 };
    }

    appData.hourlyLog[dateStr][hourStr].linesDelta += deltaToAdd;
    appData.hourlyLog[dateStr][hourStr].maxLine = newLine;

    if (!appData.dailyHistory[dateStr]) {
      appData.dailyHistory[dateStr] = { endLine: newLine, totalDelta: 0 };
    }
    appData.dailyHistory[dateStr].endLine = newLine;
    appData.dailyHistory[dateStr].totalDelta += deltaToAdd;

    appData.currentLine = newLine;
    localStorage.setItem('study_tracker_data', JSON.stringify(appData));

    renderTables();
  }

  function adjustLine(amount) {
    currentLine = Math.max(0, currentLine + amount);
    document.getElementById('line-input').value = currentLine;
    
    if (isPaused) {
      togglePause();
    } else {
      resetInactivityTimer();
    }
    
    const delta = amount > 0 ? amount : 0;
    updateLog(currentLine, delta);
  }

  function onManualInputChange() {
    const inputVal = parseInt(document.getElementById('line-input').value, 10);
    currentLine = isNaN(inputVal) || inputVal < 0 ? 0 : inputVal;
    document.getElementById('line-input').value = currentLine;
    
    if (isPaused) {
      togglePause();
    } else {
      resetInactivityTimer();
    }
    
    updateLog(currentLine, 0);
  }

  function renderTables() {
    const todayKey = new Date().toISOString().split('T')[0];

    // Render Orario Odierno
    const hourlyTbody = document.querySelector('#hourly-table tbody');
    hourlyTbody.innerHTML = '';
    const todayLogs = appData.hourlyLog[todayKey] || {};
    const sortedHours = Object.keys(todayLogs).sort().reverse();

    if (sortedHours.length === 0) {
      hourlyTbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--muted)">Nessun log per oggi</td></tr>`;
    } else {
      sortedHours.forEach(hour => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="badge">${hour}</span></td>
          <td class="text-right">${todayLogs[hour].maxLine}</td>
          <td class="text-right" style="color: #4ade80">+${todayLogs[hour].linesDelta}</td>
        `;
        hourlyTbody.appendChild(row);
      });
    }

    // Render Storico Giornaliero
    const historyTbody = document.querySelector('#history-table tbody');
    historyTbody.innerHTML = '';
    const sortedDates = Object.keys(appData.dailyHistory).sort().reverse();

    if (sortedDates.length === 0) {
      historyTbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--muted)">Nessuno storico presente</td></tr>`;
    } else {
      sortedDates.forEach(date => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${date}</td>
          <td class="text-right">${appData.dailyHistory[date].endLine}</td>
          <td class="text-right" style="color: #4ade80">+${appData.dailyHistory[date].totalDelta}</td>
        `;
        historyTbody.appendChild(row);
      });
    }
  }

  // Timer di inattività (1s)
  setInterval(() => {
    if (isPaused) return;

    const elapsed = Date.now() - lastActivityTime;
    const remaining = Math.max(0, inactivityLimitMs - elapsed);

    const mins = String(Math.floor(remaining / 60000)).padStart(2, '0');
    const secs = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
    document.getElementById('time-remaining').textContent = `${mins}:${secs}`;

    if (elapsed >= inactivityLimitMs) {
      startAlarm();
    }
  }, 1000);

  // Inizializzazioni
  initAudioSource();
  renderTables();
</script>

</body>
</html>
